<!DOCTYPE html>
<html lang="en">
    <head>
        <title>To-do List</title>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <script defer src="main.js"></script></head>
    <body>
        <div class="main">
            <div class="header">
                To-do List
            </div>
            <div class="navigation">
                <div class="navigation-content">
                    <div class="group-heading">Home</div>
                    <div class="group-heading">Today</div>
                    <div class="group-heading">Week</div>
                    <div class="group-heading project">Projects</div>
                    <div class="Projects">
                        <div class="one">Hello</div>
                        <div class="two">World</div>
                        <div class="three">MWAH</div>
                    </div>
                </div>
                <div class="navigation-add">
                    <button class="add">Add Todo/Project</button>
                </div>
            </div>
            <div class="content"></div>
        </div>
    </body>
</html>
