<!DOCTYPE html>
<html lang="en">
    <head>
        <title>To-do List</title>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="main">
            <div class="overlay-two">
                <div class="project-form">
                    <div class="project-form-heading">
                        <div class="project-form-heading-one">Add Project</div>
                    </div>
                    <form id="project-for">
                        <input type="text" id="project-title" name="project-title" placeholder="project-title">
                        <button type="submit" id="project-button">Submit</button>
                    </form>
                </div>
            </div>
            <div class="overlay">
                <div class="main-form">
                    <div class="main-form-heading">
                        <div class="main-form-heading-one">Add Todo</div>
                    </div>
                    <form id="form">
                        <input type="text" id="title" name="title" placeholder="Title" class="input" required>
                        <textarea id="description" placeholder="Enter Description..."></textarea>
                        <div class="second">
                            <label for="duedate">Due date</label>
                            <input type="date" id="duedate" name="duedate" placeholder="21/12/2025" required>
                            <label for="project">Project</label>
                            <select id="project">
                                <option value="nothing">No project</option>
                            </select>
                        </div>
                        <div class="third">
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="low">Low</option>
                                <option value="medium">medium</option>
                                <option vallue="high">high</option>
                            </select>
                        </div>
                        <div class="fourth">
                            <textarea id="notes" name="notes" placeholder="notes..."></textarea>
                            <button type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="header">
                To-do List
            </div>
            <div class="navigation">
                <div class="navigation-content">
                    <div class="group-heading home">Home</div>
                    <div class="group-heading today">Today</div>
                    <div class="group-heading week">Week</div>
                    <div class="group-heading project">Projects</div>
                    <div class="Projects">
                    </div>
                </div>
                <div class="navigation-add">
                    <button class="add">Add Todo</button>
                    <button class="add-project">Add Project</button>
                </div>
            </div>
            <div class="content"></div>
        </div>
    </body>
</html>
